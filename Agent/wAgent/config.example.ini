# wAgent 配置文件
# 首次运行自动生成。请把 apikey 换成真实值后重新启动 wAgent。

[llm]
; 必需：OpenAI 兼容接口地址、密钥、模型名
base_url = https://api.deepseek.com/v1
api_key = sk-请替换为你的真实APIKey
model = deepseek-chat
; 单次请求超时（秒）
timeout = 120

[agent]
; 每轮最多允许几次「工具调用→再请求模型」
max_tool_rounds = 199
; 每轮调用模型的总次数上限（含最后一次生成回答）
max_model_calls_per_round = 200

[context]
; 上下文占用达到该比例时提示压缩
warn_ratio = 0.70
; 超过该比例显示危险色
danger_ratio = 0.85
; 无法识别模型上下文窗口时的默认值
default_window = 131072
; 压缩摘要的目标 token 数
summary_target_tokens = 5000
; 归档目录（相对项目根）
archive_dir = .agents/context
; 单条归档记录的最大保存长度
max_content_chars = 200000
; recallContext 返回的片段数上限
recall_max_snippets = 6
; 单个片段的字符数
recall_snippet_chars = 400
; 检索结果总长度上限
recall_max_total_chars = 4000

[session]
; 会话保存目录（相对项目根）
dir = .agents/sessions
; /new 时是否自动保存当前会话
autosave = true
; 项目指令文件名
agents_md = AGENTS.md

[search]
; 百度千帆智能搜索的 API Key，留空则 searchWeb 不可用
baidu_qianfan_api_key =
endpoint = https://qianfan.baidubce.com/v2/ai_search/chat/completions
resource_id = ai_search
search_source = baidu_search_v2
top_k = 5
timeout_seconds = 20

[fetch]
; 本地 curl 可执行文件名
curl_path = curl
timeout_seconds = 20
; 单页正文最大字符数
max_chars = 12000
; 留空使用内置 User-Agent
user_agent =

[cli]
; 命令执行超时（秒）
timeout_seconds = 15
; stdout / stderr 各自的最大字符数
max_output_chars = 4000
; 留空则使用当前工作目录
workdir =

[fs]
; readFile 单次返回的最大字符数
max_read_chars = 20000
; listDir 最多列出的条目数
max_list_entries = 500
; 允许访问的根目录，多个用逗号分隔。留空表示不限制。
; 建议显式限定，防止模型误操作范围外的文件。
; 例如：allowed_roots = D:/office, D:/projects
allowed_roots =
; 覆盖已有文件、删除操作是否要求显式确认
require_confirm = true
; 是否自动把当前工作目录加入允许范围
include_cwd = true

[mcp]
; MCP 服务器配置文件（相对项目根）
filename = .mcp.json
connect_timeout = 10
call_timeout = 60
; 工具名冲突时的前缀策略：auto / always / never
prefix_mode = auto
; 是否异步加载 MCP（先进入界面再连接）
async_load = true

[ui]
; 侧栏宽度（列）
sidebar_width = 38
; 技能描述最多显示多少字
max_skill_desc = 56
; 工具描述最多显示多少字
max_tool_desc = 60
