[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pet-hospital-mcp"
version = "1.0.0"
description = "Stateless MCP 2026-07-28 server exposing the pet hospital REST API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp==2.0.0",
  "httpx>=0.28.1,<1",
  "pydantic>=2.12,<3",
]

[project.optional-dependencies]
test = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=1,<2",
]

[project.scripts]
pet-hospital-mcp = "pet_hospital_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra -p no:cacheprovider"

